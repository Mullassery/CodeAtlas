name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test core
        run: cargo test -p codeatlas-core
      - name: Dependency audit (licenses + advisories)
        uses: EmbarkStudios/cargo-deny-action@v2

  python:
    name: Python (build wheel + import + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release --interpreter python3.12 --out dist
      - name: Install and smoke-test
        run: |
          pip install dist/*.whl
          python -c "import codeatlas; assert codeatlas.__version__"
          codeatlas --version
      - name: Python tests
        run: pip install pytest && pytest

  bundle:
    name: Bundle package (import + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install maturin
      - name: Build and install codeatlas
        run: |
          maturin build --release --interpreter python3.12 --out dist
          pip install dist/*.whl
      - name: Install bundle package
        run: pip install --no-deps -e packages/codeatlas-bundle
      - name: Bundle tests
        run: |
          pip install pytest
          pytest packages/codeatlas-bundle/tests