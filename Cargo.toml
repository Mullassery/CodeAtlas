[workspace]
resolver = "2"
members = ["crates/core", "crates/py"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/Mullassery/CodeAtlas"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true